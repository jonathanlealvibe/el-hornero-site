  <body>

    <script>if("serviceWorker" in navigator){window.addEventListener("load",()=>navigator.serviceWorker.register("/sw.js"))}</script>
    <!-- GoHighLevel Voice AI widget: "El Hornero - Asistente de Voz".
         It is a fixed bubble in the bottom-right corner, exactly where the primary button of
         the pay, checkout and rider screens lives, and it swallows the tap. So it is loaded
         only on the browsing screens, and removed again when the route changes. -->
    <script>
      (function () {
        var OFF = ['#/pago', '#/checkout', '#/repartidor', '#/panel'];
        var node = null;
        var blocked = function () {
          var h = location.hash || '';
          for (var i = 0; i < OFF.length; i++) if (h.indexOf(OFF[i]) === 0) return true;
          return false;
        };
        var show = function () {
          if (node) return;
          node = document.createElement('script');
          node.src = 'https://widgets.leadconnectorhq.com/loader.js';
          node.setAttribute('data-resources-url', 'https://widgets.leadconnectorhq.com/chat-widget/loader.js');
          node.setAttribute('data-widget-id', '6aa72e225b157680cb75ae4c');
          document.body.appendChild(node);
        };
        var hide = function () {
          document.querySelectorAll('chat-widget, .lc_text-widget').forEach(function (n) { n.remove(); });
        };
        var sync = function () { if (blocked()) hide(); else show(); };
        window.addEventListener('hashchange', sync);
        sync();
      })();
    </script>
  </body>
