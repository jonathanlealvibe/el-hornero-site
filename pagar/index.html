<style>body{margin:0;font:15px -apple-system,system-ui,sans-serif;color:#1D1D1B;display:grid;place-items:center;height:100vh}</style>
<script>
  // The order rides in the fragment: #<id>.<payload>. A fragment never reaches the server,
  // so the customer's data stays out of logs and out of Meta's preview crawler.
  (function () {
    var h = (location.hash || '').replace(/^#/, '');
    if (!h) { location.replace('/'); return; }
    var i = h.indexOf('.');
    var id = i > -1 ? h.slice(0, i) : h;
    var d = i > -1 ? h.slice(i + 1) : '';
    location.replace('/#/pago/' + id + (d ? '?d=' + d : ''));
  })();
</script>
